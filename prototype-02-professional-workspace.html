<!doctype html>
<!--
  prototype-02-professional-workspace.html
  ============================================================================
  Vite ENTRY file for Prototype 02 - "Code Flow Pro".

  Prototype 2 is a desktop-first, professional AI video production workspace.
  It is deliberately NOT Prototype 01 with a dark theme: it exposes scenes,
  shots, camera, lighting, timeline and parameters instead of hiding them.

  During development this file is served by `npm run dev`. After
  `npm run build:02`, Vite + vite-plugin-singlefile inline the compiled JS and
  CSS into a copy of this file inside ./dist, producing one self-contained
  deliverable you can open by double-clicking.

  Notes
    * `color-scheme: dark` makes native controls (scrollbars, selects) match
      the studio palette instead of arriving in light-mode chrome.
    * The favicon is an inline SVG data-URI. We deliberately avoid a /public
      folder because those files are NOT inlined by the single-file plugin.
    * No external fonts or CDNs - Inter is self-hosted and base64-inlined.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Code Flow Pro - a professional AI video production workspace for filmmakers, creators and marketers. Prototype 02 of the E-Song Intelligent frontend assignment."
    />

    <!-- Inline SVG favicon: a restrained blue play mark on a dark tile. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230B0D10'/%3E%3Cpath d='M9 22V10l5.5 6z' fill='%235B8DEF'/%3E%3Cpath d='M17 22V10l5.5 6z' fill='%235B8DEF' opacity='.6'/%3E%3C/svg%3E"
    />

    <title>Code Flow Pro - Professional AI Video Workspace</title>
  </head>
  <body>
    <div id="app"></div>

    <noscript>
      <div
        style="font-family: system-ui, sans-serif; padding: 2rem; max-width: 40rem; margin: 0 auto; background: #0b0d10; color: #f2f4f7"
      >
        <h1>Code Flow Pro</h1>
        <p>
          This prototype is an interactive front-end demo and requires JavaScript to be
          enabled in your browser.
        </p>
      </div>
    </noscript>

    <!-- Application entry point. -->
    <script type="module" src="/src/prototypes/02-professional-workspace/main.js"></script>
  </body>
</html>
