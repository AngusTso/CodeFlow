  prototype-02-professional-workspace.html
  ============================================================================
  Vite ENTRY file for Prototype 02 - "Code Flow Pro".

  Prototype 2 is a desktop-first, professional AI video production workspace.
  It is deliberately NOT Prototype 01 with a dark theme: it exposes scenes,
  shots, camera, lighting, timeline and parameters instead of hiding them.

  During development this file is served by `npm run dev`. After
  `npm run build:02`, Vite + vite-plugin-singlefile inline the compiled JS and
  CSS into a copy of this file inside ./dist, producing one self-contained
  deliverable you can open by double-clicking.

  Notes
    * `color-scheme: dark` makes native controls (scrollbars, selects) match
      the studio palette instead of arriving in light-mode chrome.
    * The favicon is an inline SVG data-URI. We deliberately avoid a /public
      folder because those files are NOT inlined by the single-file plugin.
    * No external fonts or CDNs - Inter is self-hosted and base64-inlined.
-->
