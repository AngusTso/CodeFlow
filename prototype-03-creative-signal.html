<!doctype html>
<!--
  prototype-03-creative-signal.html
  ============================================================================
  Vite ENTRY file for Prototype 03 - "Creative Signal".

  Prototype 3 is an EXPERIMENTAL AI VIDEO EXPLORATION WORKSPACE. It is not a
  reskin of Prototype 01 or 02:

    P1  "I have an idea. Help me make a video."  -> guided wizard, mobile-first
    P2  "I know what I'm doing. Make it faster." -> professional workspace
    P3  "I don't know what this could become."  -> creative universe, branching

  Its core loop is SIGNAL -> DISCOVER -> COMBINE -> GENERATE -> EXPLORE ->
  BRANCH -> STABILIZE -> VIDEO, which is why this build is desktop + tablet
  first and why the Creative Universe (a pan/zoom concept map) is the centre.

  During development this file is served by the Vite dev server. After
  `npm run build:03`, Vite + vite-plugin-singlefile inline the compiled JS,
  the generated CSS AND both self-hosted woff2 fonts into a copy of this file
  inside ./dist, producing ONE self-contained deliverable you can open by
  double-clicking (brief section 66).

  Notes
    * `color-scheme: dark` makes native controls (scrollbars, selects) match the
      terminal palette instead of arriving in light-mode chrome.
    * The favicon is an inline SVG data-URI. We deliberately avoid a /public
      folder because those files are NOT inlined by the single-file plugin.
    * No external fonts, scripts, stylesheets or images - the built file makes
      ZERO network requests, so it works fully offline from `file://`.
-->

  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />

      name="description"
      content="Creative Signal - an experimental AI creative exploration system. Give the machine a signal, discover a universe of visual possibilities, combine and branch them, then stabilise one into a cinematic sequence. Prototype 03 of the E-Song Intelligent frontend assignment."
    />
